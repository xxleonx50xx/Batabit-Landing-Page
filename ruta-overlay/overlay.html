<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay de ruta — previsualización</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tipografía de la etiqueta del pin (la misma que usa render.py desde fonts/DMSans-Bold.ttf) -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f1215; color: #e6e9ec; font: 14px/1.4 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  #stage { position: relative; width: min(100vw - 32px, calc((100vh - 120px) * 9 / 16)); aspect-ratio: 9 / 16; background: #000; border-radius: 12px; overflow: hidden; cursor: crosshair; }
  #stage video, #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage svg { pointer-events: none; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100vw - 32px, 720px); flex-wrap: wrap; }
  button { background: #1fe36a; color: #0b1f12; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 44px; font-family: inherit; }
  input[type=range] { flex: 1; min-width: 160px; }
  .hint { color: #9aa4ad; font-size: 12px; }
  code { background: #1b2026; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div id="stage">
    <!-- Convierte el .mov HEVC a H.264 para que lo reproduzca cualquier navegador:
         ffmpeg -i video_mapa.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac video_mapa.mp4 -->
    <video id="video" src="./video_mapa.mp4" playsinline muted preload="auto"></video>
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  </div>
  <div class="bar">
    <button id="play" type="button">Reproducir</button>
    <input id="scrub" type="range" min="0" max="4" step="0.0333" value="0" aria-label="Posición del video">
    <span id="time">0.00 s · fotograma 0</span>
  </div>
  <p class="hint">Espacio: reproducir/pausar · ← →: un fotograma · Clic sobre el video: muestra la coordenada nativa para <code>route.json</code></p>
  <p class="hint" id="coords"></p>
  <script src="./overlay.js"></script>
</body>
</html>
